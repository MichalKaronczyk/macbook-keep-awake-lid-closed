name: release

# Push a tag such as v1.0.0 to build the app and publish it on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Stamp the version from the tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist
      - name: Assemble the app bundle
        run: ./build.sh
      - name: Zip
        run: |
          ditto -c -k --keepParent "build/Claude Not Close.app" "ClaudeNotClose-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "ClaudeNotClose-${GITHUB_REF_NAME}.zip" > "ClaudeNotClose-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ClaudeNotClose-${GITHUB_REF_NAME}.zip" \
            "ClaudeNotClose-${GITHUB_REF_NAME}.zip.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
